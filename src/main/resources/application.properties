spring.config.import=optional:file:.env[.properties]
spring.application.name=RiskShield

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Marqeta
marqeta.base-url=${MARQETA_BASE_URL}
marqeta.application-token=${MARQETA_APPLICATION_TOKEN}
marqeta.admin-access-token=${MARQETA_ADMIN_ACCESS_TOKEN}
spring.config.import=optional:file:.env[.properties]
spring.application.name=RiskShield
riskshield.sandbox.enabled=true

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b
spring.ai.ollama.chat.options.temperature=0.2

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Marqeta
marqeta.base-url=${MARQETA_BASE_URL}
marqeta.application-token=${MARQETA_APPLICATION_TOKEN}
marqeta.admin-access-token=${MARQETA_ADMIN_ACCESS_TOKEN}
marqeta.card-product-token=${MARQETA_CARD_PRODUCT_TOKEN}
marqeta.funding-source-token=${MARQETA_FUNDING_SOURCE_TOKEN}
# Webhooks
webhook.username=${WEBHOOK_USERNAME}
webhook.password=${WEBHOOK_PASSWORD}
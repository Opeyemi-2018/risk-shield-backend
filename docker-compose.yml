services:
  postgres:
    image: postgres:17
    container_name: riskshield-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - riskshield-data:/var/lib/postgresql/data

volumes:
  riskshield-data: